# CanteenSys — Docker (shared SQL Server at 192.168.153.248)
# Run: deploy\docker\docker-start.ps1
# LAN: http://192.168.120.51:365/

services:
  cms:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: cms-web
    restart: unless-stopped
    ports:
      - "${CMS_PORT:-365}:${CMS_PORT:-365}"
    environment:
      CMS_PORT: ${CMS_PORT:-365}
      DB_NAME: ${DB_NAME:-CanteenManagementDB}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-@Mis#Dev}
      DB_HOST: ${DB_HOST:-192.168.153.248}
      DB_PORT: ${DB_PORT:-1433}
      DB_DRIVER: ${DB_DRIVER:-ODBC Driver 18 for SQL Server}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-cms-docker-lan-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,192.168.120.51,192.168.153.248}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:365,http://localhost:365,http://192.168.120.51:365,http://192.168.153.248:365}
      FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME:-}
      STATIC_URL: /static/
      MEDIA_URL: /media/
      # POS voice LLM keys — normally managed in DB (admin → API integrations);
      # these are a fallback only when the api_integrations table is empty.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    volumes:
      - ../../media:/app/media
