<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Display — Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #060a12;
            --panel: rgba(15, 23, 42, 0.72);
            --border: rgba(148, 163, 184, 0.14);
            --prep: #f59e0b;
            --prep-bg: rgba(245, 158, 11, 0.14);
            --ready: #22c55e;
            --ready-bg: rgba(34, 197, 94, 0.18);
            --serve: #38bdf8;
            --serve-bg: rgba(56, 189, 248, 0.2);
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 0% 0%, rgba(34, 197, 94, 0.12), transparent 55%),
                radial-gradient(ellipse 45% 40% at 100% 100%, rgba(56, 189, 248, 0.1), transparent 50%),
                radial-gradient(ellipse 30% 25% at 50% 50%, rgba(245, 158, 11, 0.06), transparent 60%);
            pointer-events: none;
        }
        .display-root {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding: 0.5rem 0.65rem 0.55rem;
            gap: 0.45rem;
        }
        .display-top {
            display: flex;
            align-items: stretch;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.35rem 0.5rem;
            border-radius: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #fff;
        }
        .brand h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        .brand p {
            margin: 0;
            font-size: 0.62rem;
            color: var(--muted);
            line-height: 1.2;
        }
        .top-meta {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
            margin-left: auto;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.45rem;
            border-radius: 999px;
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
        }
        .pill.live { color: #4ade80; border-color: rgba(74, 222, 128, 0.35); background: rgba(34, 197, 94, 0.12); }
        .pill.live.offline { color: #f87171; border-color: rgba(248, 113, 113, 0.35); background: rgba(239, 68, 68, 0.1); }
        .pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: livePulse 1.6s ease infinite;
        }
        .pill.live.offline .pill-dot { animation: none; }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        .clock {
            font-size: 1.05rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
        }
        .btn-fs {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-fs:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

        /* Compact now-serving strip */
        .serve-strip {
            flex: 1;
            min-width: 140px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--serve-bg), rgba(15, 23, 42, 0.85));
            border: 1px solid rgba(56, 189, 248, 0.4);
            overflow: hidden;
        }
        .serve-strip.empty {
            border-color: var(--border);
            background: var(--panel);
        }
        .serve-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--serve);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .serve-strip.empty .serve-label { color: var(--muted); }
        .serve-tokens {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            align-items: center;
            flex: 1;
            min-width: 0;
        }
        .serve-token {
            font-size: clamp(1.6rem, 3.5vw, 2.25rem);
            font-weight: 800;
            line-height: 1;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.25);
            color: #fff;
            border: 1px solid rgba(56, 189, 248, 0.5);
        }
        .serve-hint {
            font-size: 0.65rem;
            color: var(--muted);
            font-weight: 600;
            white-space: nowrap;
        }
        .stat-pills {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
            align-items: center;
        }
        .stat-pill {
            padding: 0.25rem 0.45rem;
            border-radius: 6px;
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }
        .stat-pill b {
            font-size: 1.2rem;
            margin-left: 0.2rem;
            font-weight: 800;
        }
        .stat-pill.prep b { color: #fcd34d; }
        .stat-pill.ready b { color: #86efac; }

        .display-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.35rem;
            min-height: 0;
        }
        .col-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .col-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.28rem 0.5rem;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .col-head.prep {
            background: var(--prep-bg);
            color: #fcd34d;
            border-bottom: 2px solid rgba(245, 158, 11, 0.35);
        }
        .col-head.ready {
            background: var(--ready-bg);
            color: #86efac;
            border-bottom: 2px solid rgba(34, 197, 94, 0.35);
        }
        .col-count {
            font-size: 1.2rem;
            font-weight: 800;
            opacity: 0.95;
            min-width: 1.5rem;
            text-align: right;
        }
        .token-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.45rem;
            min-height: 0;
        }
        .token-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .token-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .token-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
        }
        .token-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.85rem;
            padding: 0.3rem 0.5rem;
            font-size: clamp(1rem, 2.4vw, 1.35rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            border-radius: 6px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(71, 85, 105, 0.9);
            line-height: 1.1;
        }
        .token-box.ready {
            background: #15803d;
            border-color: #4ade80;
            color: #fff;
        }
        .token-box.called {
            box-shadow: 0 0 0 2px var(--serve);
            background: #166534;
        }
        .empty-state {
            width: 100%;
            text-align: center;
            padding: 1rem 0.5rem;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 600;
        }
        .empty-state i {
            display: block;
            font-size: 1.1rem;
            opacity: 0.4;
            margin-bottom: 0.25rem;
        }

        /* Large TV / wall display */
        @media (min-width: 1280px) {
            .token-box {
                min-width: 3.25rem;
                padding: 0.35rem 0.6rem;
                font-size: clamp(1.15rem, 2.8vw, 1.55rem);
            }
            .serve-token {
                font-size: clamp(1.85rem, 4vw, 2.6rem);
                padding: 0.3rem 0.75rem;
            }
            .col-head { font-size: 0.95rem; }
            .col-count { font-size: 1.4rem; }
        }

        @media (max-width: 900px) {
            .display-board { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="display-root">
    <header class="display-top">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-ticket-perforated-fill"></i></div>
            <div>
                <h1>Pickup</h1>
                <p id="display-date">—</p>
            </div>
        </div>
        <section class="serve-strip empty" id="serve-strip">
            <span class="serve-label"><i class="bi bi-megaphone-fill"></i> Now</span>
            <div class="serve-tokens" id="serve-tokens"></div>
            <span class="serve-hint" id="serve-hint">—</span>
        </section>
        <div class="stat-pills">
            <span class="stat-pill prep">Prep<b id="count-prep">0</b></span>
            <span class="stat-pill ready">Rdy<b id="count-ready">0</b></span>
        </div>
        <div class="top-meta">
            <span class="pill live" id="live-pill"><span class="pill-dot"></span> Live</span>
            <span class="clock" id="clock">--:--</span>
            <button type="button" class="btn-fs" id="btn-fullscreen" title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button>
        </div>
    </header>

    <main class="display-board">
        <section class="col-panel">
            <div class="col-head prep">
                <span><i class="bi bi-fire me-1"></i> Preparing</span>
                <span class="col-count" id="count-prep-col">0</span>
            </div>
            <div class="token-scroll">
                <div class="token-grid" id="grid-preparing"></div>
            </div>
        </section>
        <section class="col-panel">
            <div class="col-head ready">
                <span><i class="bi bi-bag-check-fill me-1"></i> Ready</span>
                <span class="col-count" id="count-ready-col">0</span>
            </div>
            <div class="token-scroll">
                <div class="token-grid" id="grid-ready"></div>
            </div>
        </section>
    </main>
</div>

<script>
const BOARD_URL = '{{ board_api }}';
const STREAM_URL = '{{ stream_url }}';
const CHIME_URL = 'https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3';

let queueVersion = 0;
let previousReady = [];
let streamSource = null;

function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-BD', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true,
    });
}
tickClock();
setInterval(tickClock, 1000);

function setLive(online) {
    const el = document.getElementById('live-pill');
    el.className = 'pill live' + (online ? '' : ' offline');
    el.innerHTML = '<span class="pill-dot"></span> ' + (online ? 'Live' : 'Offline');
}

function playChime() {
    try {
        const a = new Audio(CHIME_URL);
        a.volume = 0.55;
        a.play().catch(() => {});
    } catch (e) {}
}

function renderEmpty(gridId, icon, msg) {
    document.getElementById(gridId).innerHTML =
        '<div class="empty-state"><i class="bi ' + icon + '"></i>' + msg + '</div>';
}

function setCount(id, n) {
    const el = document.getElementById(id);
    if (el) el.textContent = n;
}

function renderPreparing(list) {
    setCount('count-prep', list.length);
    setCount('count-prep-col', list.length);
    const grid = document.getElementById('grid-preparing');
    if (!list.length) {
        renderEmpty('grid-preparing', 'bi-hourglass-split', 'No orders');
        return;
    }
    grid.innerHTML = list.map(t => '<div class="token-box">#' + t + '</div>').join('');
}

function renderReady(readyTokens, readyDetails) {
    const calledSet = new Set(
        (readyDetails || []).filter(d => d.called).map(d => d.token)
    );
    setCount('count-ready', readyTokens.length);
    setCount('count-ready-col', readyTokens.length);

    const grid = document.getElementById('grid-ready');
    if (!readyTokens.length) {
        renderEmpty('grid-ready', 'bi-inbox', 'None ready');
        previousReady = [];
        return;
    }

    const newReady = readyTokens.filter(t => !previousReady.includes(t));
    if (newReady.length) playChime();
    previousReady = readyTokens.slice();

    grid.innerHTML = readyTokens.map(t => {
        const cls = 'token-box ready' + (calledSet.has(t) ? ' called' : '');
        return '<div class="' + cls + '">#' + t + '</div>';
    }).join('');
}

function renderNowServing(nowServing) {
    const strip = document.getElementById('serve-strip');
    const wrap = document.getElementById('serve-tokens');
    const hint = document.getElementById('serve-hint');

    if (!nowServing || !nowServing.length) {
        strip.classList.add('empty');
        wrap.innerHTML = '';
        hint.textContent = '—';
        return;
    }

    strip.classList.remove('empty');
    const shown = nowServing.slice(0, 8);
    wrap.innerHTML = shown.map(row =>
        '<span class="serve-token">#' + row.token + '</span>'
    ).join('');
    const extra = nowServing.length - shown.length;
    hint.textContent = extra > 0 ? '+' + extra + ' more' : '';
}

function applyBoard(data) {
    if (!data || !data.success) return;
    if (typeof data.version === 'number') queueVersion = data.version;

    if (data.queue_date) {
        const d = new Date(data.queue_date + 'T12:00:00');
        document.getElementById('display-date').textContent =
            d.toLocaleDateString('en-BD', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    renderPreparing(data.preparing || []);
    renderReady(data.ready || [], data.ready_details || []);
    renderNowServing(data.now_serving || []);
}

function fetchBoard() {
    return fetch(BOARD_URL, { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
            applyBoard(data);
            setLive(true);
            return data;
        })
        .catch(() => {
            setLive(false);
        });
}

function connectStream() {
    if (streamSource) {
        streamSource.close();
        streamSource = null;
    }
    streamSource = new EventSource(STREAM_URL + '?since=' + encodeURIComponent(queueVersion));
    streamSource.addEventListener('update', () => fetchBoard());
    streamSource.onopen = () => setLive(true);
    streamSource.onerror = () => {
        setLive(false);
        streamSource.close();
        streamSource = null;
        setTimeout(connectStream, 3000);
    };
}

document.getElementById('btn-fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
});

fetchBoard().then(() => connectStream());
setInterval(fetchBoard, 8000);
window.addEventListener('beforeunload', () => {
    if (streamSource) streamSource.close();
});
</script>
</body>
</html>
