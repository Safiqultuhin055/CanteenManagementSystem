{% extends 'core/layout_app.html' %}
{% block page_title %}Access denied{% endblock %}

{% block page_content %}
<div class="text-center py-5">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 mb-4" style="width:88px;height:88px;">
        <i class="bi bi-shield-lock text-danger display-5"></i>
    </div>
    <h2 class="fw-bold">Technical documentation is restricted</h2>
    <p class="text-muted col-lg-6 mx-auto">Only administrators or users with the <code>TECH_DOC_VIEW</code> permission can open this page.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
        <a href="{% url 'core:help_user_manual' %}" class="btn btn-primary"><i class="bi bi-book me-1"></i>User Manual</a>
        <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">Back to home</a>
    </div>
</div>
{% endblock %}
